<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CS PolyVoice AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              background: 'var(--c-bg)',
              surface: 'var(--c-surface)',
              surfaceHighlight: 'var(--c-surface-highlight)',
              primary: 'var(--c-primary)',
              primaryGlow: 'var(--c-primary-glow)',
              accent: 'var(--c-accent)',
              accentGlow: 'var(--c-accent-glow)',
              success: '#10b981', 
              danger: '#ef4444', 
              white: 'var(--c-white)',
              black: 'var(--c-black)',
              slate: {
                400: 'var(--c-slate-400)',
                800: '#1e293b',
              }
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
              'scanline': 'scanline 8s linear infinite',
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-up': 'slideUp 0.4s ease-out forwards',
              'grid-move': 'gridMove 20s linear infinite',
              'breathe': 'breathe 3s ease-in-out infinite',
              'equalizer': 'equalizer 1s ease-in-out infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              equalizer: {
                '0%, 100%': { height: '20%' },
                '50%': { height: '100%' },
              },
              glow: {
                '0%': { boxShadow: '0 0 5px var(--c-primary), 0 0 10px var(--c-primary)' },
                '100%': { boxShadow: '0 0 20px var(--c-primary-glow), 0 0 30px var(--c-primary-glow)' },
              },
              scanline: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              gridMove: {
                '0%': { backgroundPosition: '0 0' },
                '100%': { backgroundPosition: '0 40px' },
              },
              breathe: {
                '0%, 100%': { transform: 'scale(1)', opacity: '1' },
                '50%': { transform: 'scale(1.05)', opacity: '0.9' },
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

      :root {
        /* Default Dark Mode */
        --c-bg: #020617;
        --c-surface: #0f172a;
        --c-surface-highlight: #1e293b;
        --c-primary: #6366f1;
        --c-primary-glow: #818cf8;
        --c-accent: #22d3ee;
        --c-accent-glow: #67e8f9;
        --c-white: #ffffff;
        --c-black: #000000;
        --c-slate-400: #94a3b8;
        --glass-bg: rgba(15, 23, 42, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
        --grid-color: rgba(99, 102, 241, 0.1);
      }

      [data-theme='light'] {
        /* Light Mode Overrides */
        --c-bg: #f1f5f9;
        --c-surface: #ffffff;
        --c-surface-highlight: #e2e8f0;
        --c-primary: #4f46e5;
        --c-primary-glow: #6366f1;
        --c-accent: #0891b2;
        --c-accent-glow: #06b6d4;
        --c-white: #0f172a;
        --c-black: #ffffff;
        --c-slate-400: #64748b;
        --glass-bg: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(0, 0, 0, 0.05);
        --grid-color: rgba(79, 70, 229, 0.05);
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--c-bg);
        color: var(--c-white);
        transition: background-color 0.5s ease, color 0.5s ease;
        overflow-x: hidden;
      }

      /* Global Noise Texture */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 1;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
      
      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }

      .glass-button {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(4px);
      }
      
      .cyber-grid {
        background-image: 
          linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
        background-size: 40px 40px;
        transform: perspective(500px) rotateX(60deg);
        transform-origin: top center;
        opacity: 0.5;
        animation: gridMove 20s linear infinite;
      }

      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      .mask-image-gradient {
        mask-image: linear-gradient(to bottom, transparent 0%, black 20px, black calc(100% - 20px), transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20px, black calc(100% - 20px), transparent 100%);
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="text-white selection:bg-accent selection:text-black min-h-screen">
    <div class="bg-noise"></div>
    <div id="root" class="w-full min-h-screen flex flex-col relative z-10"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
